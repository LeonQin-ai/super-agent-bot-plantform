<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>light-agent 控制台</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header><strong>light-agent</strong><form id="auth"><label>管理 Token <input id="token" type="password" autocomplete="off"></label><button>连接</button></form></header>
  <main>
    <div class="intro"><div><h1>Agent 控制台</h1><p id="runtime">正在连接控制面</p></div><button id="refresh">刷新</button></div>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="actions">
      <section><h2>部署 Agent</h2><p>创建后，首个任务会按需启动 Worker。</p><form id="create"><label>租户 ID<input name="tenant_id" required maxlength="100" placeholder="例如 engineering"></label><button>创建 Agent</button></form></section>
      <section><h2>批量会话</h2><p>为当前所有 Agent 各创建一条会话任务。</p><form id="broadcast"><label>消息<textarea name="content" required maxlength="16000"></textarea></label><button data-runtime disabled>批量发送</button></form></section>
      <section><h2>定时任务</h2><p>每次运行时向当时的所有 Agent 入队。</p><form id="schedule"><label>任务内容<textarea name="content" required maxlength="16000"></textarea></label><label>首次执行（本地时间）<input name="first_run" type="datetime-local" required></label><label>间隔（分钟）<input name="minutes" type="number" min="1" max="525600" value="60" required></label><button data-runtime disabled>创建定时任务</button></form></section>
    </div>
    <section><h2>Agent 列表</h2><div class="scroll"><table><thead><tr><th>Agent ID</th><th>租户</th><th>状态</th><th>最近活动</th></tr></thead><tbody id="agents"></tbody></table></div><button id="next" hidden>下一页</button></section>
    <section id="detail" hidden><h2 id="detail-title">任务记录</h2><form id="message"><label>发送给此 Agent<textarea name="content" required maxlength="16000"></textarea></label><button data-runtime disabled>发送</button></form><div id="tasks"></div></section>
    <section><h2>定时任务列表</h2><div id="schedules"></div></section>
  </main>
</body>
</html>
